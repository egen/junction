# Discovery answers for junction.
#   junction --answers examples/discovery-answers.example.yml --target ./payments-infra --yes
# Any question left out is asked interactively (or defaulted with --defaults).

# Phase 0 · platform
agent: claude-code            # copilot | claude-code | cursor | continue | agnostic
cloud: aws
iac_tool: terraform

# Phase 0 · discovery
existing_repo: yes            # migrating from V1 → migration-executor has real work
domain_name: payments
env_names: dv,qc,pr           # number of environments and their risk tiers are derived from this

# Phase 0 · naming (locked before any .tf exists)
naming_pattern: recommended   # matches "{domain}-{env}-{resource-type}-{purpose} (recommended)"

# Phase 1 · agent graph
jira_required: yes
auto_fix_dv: yes
parallel_research: yes
model_optimization: yes

# Phase 2 · data stores
has_rds: yes
has_msk: yes
has_s3: no

# Phase 2/4 · secrets
secret_strategy: IAM auth
external_systems: Identity Service API, Card Network Gateway

# Optional: per-tier model overrides
models:
  validator: claude-sonnet-5
  observer: claude-sonnet-5

# Optional: real environment records (override env_names)
environments:
  - {name: dv, branch: dev,  account_id: "111111111111", prefix: dv, risk_tier: LOW,    profile: payments-dv}
  - {name: qc, branch: qc,   account_id: "222222222222", prefix: qc, risk_tier: MEDIUM, profile: payments-qc}
  - {name: pr, branch: main, account_id: "333333333333", prefix: pr, risk_tier: HIGH,   profile: payments-pr}
