# agent-graph.yml — generated by junction. Validate: junction --validate-graph <file>
graph:
  version: '2.0'
  type: org
  description: IaC coding agent graph — person domain
  domain: person
naming:
  pattern: '{domain}-{env}-{resource-type}-{purpose}'
  env_values:
  - dv
  - qc
  - pr
  variable: var.environment
models:
  planner: claude-opus-5
  builder: claude-opus-5
  validator: claude-sonnet-5
  observer: claude-sonnet-5
  curator: claude-sonnet-5
nodes:
  orchestrator:
    role: Dispatch + Context Assembly
    model: planner
    zone:
    - routing
    - context-loading
    - user-intent
    tools:
    - read
    - search
    - ask-questions
    - runSubagent
    risk_gate: none
    skills:
    - env-promotion
    - drift-detection
  iac-validator:
    role: Correctness Gate
    model: validator
    zone:
    - naming
    - env-leak-detection
    - reference-integrity
    tools:
    - read
    - search
    - grep
    - get-errors
    risk_gate: none
    skills:
    - drift-detection
    - iac-triage
  terraform-builder:
    role: IaC Code Generation
    model: builder
    zone:
    - terraform-files
    - module-calls
    - variable-wiring
    tools:
    - read
    - edit
    - search
    - terminal
    - get-errors
    risk_gate: MEDIUM
    skills:
    - self-healing-deploy
    - post-push-monitor
  sre-observer:
    role: Post-Deploy Health + Triage
    model: observer
    zone:
    - health-checks
    - log-analysis
    - metric-queries
    tools:
    - read
    - search
    - terminal
    - mcp:aws-logs
    - mcp:newrelic
    risk_gate: none
    skills:
    - sre-log-fetching
    - iac-triage
  knowledge-curator:
    role: OKF Graph Maintenance
    model: curator
    zone:
    - knowledge-docs
    - cross-links
    - runbooks
    tools:
    - read
    - edit
    - search
    risk_gate: LOW
    skills:
    - knowledge-curation
  migration-executor:
    role: V1→V2 State Machine
    model: planner
    zone:
    - migration-state
    - phase-gates
    - rollback
    tools:
    - read
    - edit
    - search
    - terminal
    - mcp:aws-logs
    risk_gate: HIGH
    skills:
    - v1-v2-migration
edges:
- from: orchestrator
  to: orchestrator
  trigger: always_first
  gate: jira_ticket_linked
- from: orchestrator
  to: terraform-builder
  trigger: build | scaffold | edit-tf
- from: orchestrator
  to: iac-validator
  trigger: validate | check | pre-push
- from: orchestrator
  to: sre-observer
  trigger: triage | health | logs
- from: orchestrator
  to: migration-executor
  trigger: migrate | phase | cutover
- from: orchestrator
  to: knowledge-curator
  trigger: update-docs | stale-check
- from: terraform-builder
  to: iac-validator
  trigger: always
  gate: must pass
- from: iac-validator
  to: terraform-builder
  trigger: violations && auto_fixable
  max_cycles: 3
- from: sre-observer
  to: knowledge-curator
  trigger: incident_resolved
- from: migration-executor
  to: sre-observer
  trigger: phase_completed && health_gate
parallel:
  fan_out_in:
    pattern:
    - phase: research
      parallel: true
      nodes:
      - agent: sre-observer
        task: fetch logs
      - agent: sre-observer
        task: query metrics
      - agent: knowledge-curator
        task: load OKF context
      timeout: 30s
      fail_strategy: partial_ok
    - phase: synthesize
      agent: orchestrator
      action: deduplicate + rank
    - phase: act
      agent: terraform-builder
      gate: iac-validator
error_handling:
  decontamination:
    on_node_failure: snapshot context, isolate, do NOT carry forward
    on_retry: reload OKF fresh — never reuse stale context
    max_error_chain: 3
    after_max: hard reset — discard in-flight, escalate clean
failure_policy:
  default:
    retry: 3
    backoff: exponential
    fallback: escalate_to_human
  per_node:
    terraform-builder:
      retry: 3
    sre-observer:
      retry: 1
      fallback: escalate with raw logs
    migration-executor:
      retry: 0
      fallback: pause + human gate
evals:
  token_budget:
    per_node_warn: 50000
    per_node_hard: 100000
    per_work_graph_hard: 500000
  costly_patterns:
  - pattern: full workspace scan instead of OKF navigation
    severity: HIGH
  - pattern: generating code without knowledge load
    severity: HIGH
  - pattern: redundant MCP calls within 5min
    severity: MEDIUM
governance:
  jira_gate:
    enabled: true
    report_only_on_confirmed: true
  knowledge_scope:
    belongs:
    - services
    - architecture
    - runbooks
    - contracts
    - policies
  coding_standards:
    terraform:
    - No decorative comment blocks
    - Single var.environment (dv,qc,pr)
    - 'Naming: {domain}-{env}-{resource-type}-{purpose}'
    - 'Modules: pinned refs only'
    - 'Secrets: ignore_changes = [secret_string]'
